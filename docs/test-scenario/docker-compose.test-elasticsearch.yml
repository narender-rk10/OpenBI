services:
  test-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: openbi-test-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - openbi-network
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "http://localhost:9200/"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  openbi-network:
    external: true
    name: openbi_openbi-network

# Small standalone Postgres preloaded with the finance demo data.
# Bring it up ALONE (memory-limited friendly), connect it in OpenBI, then tear down.
#
#   docker compose -f docs/test-scenario/finance/docker-compose.yml up -d
#   # connect in OpenBI -> Data Sources -> PostgreSQL:
#   #   host=finance-pg (if on openbi-network) or host.docker.internal, port=5432
#   #   db=openbi_finance  user=demo  password=demo
#   docker compose -f docs/test-scenario/finance/docker-compose.yml down -v
services:
  finance-pg:
    image: postgres:16-alpine
    container_name: finance-pg
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: openbi_finance
    ports:
      - "5433:5432"   # host 5433 to avoid clashing with a local Postgres
    volumes:
      - ./seed-postgres.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    networks:
      - openbi-network

networks:
  openbi-network:
    external: true

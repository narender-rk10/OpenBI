services:
  test-clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: openbi-test-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_USER=clickhouse
      - CLICKHOUSE_PASSWORD=clickhouse123
      - CLICKHOUSE_DB=testdb
    networks:
      - openbi-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  openbi-network:
    external: true
    name: openbi_openbi-network

[project]
name = "openbi"
version = "0.1.0"
description = "AI-native open-source BI platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "motor>=3.6.0",
    "pymongo>=4.9.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "cryptography>=43.0.0",
    "python-multipart>=0.0.9",
    "google-generativeai>=0.8.0",
    "plotly>=5.0.0",
    "kaleido>=0.2.1",
    "pandas>=2.0.0",
    "matplotlib>=3.9.0",
    "python-pptx>=1.0.0",
    "jinja2>=3.1.0",
    "weasyprint>=62.0",
    "python-telegram-bot>=21.0",
    "redis>=5.0.0",
    "aiofiles>=24.0.0",
    "aiosmtplib>=3.0.0",
    "apscheduler>=3.10.0",
    "croniter>=2.0.0",
    "pypdf>=4.0.0",
    "openpyxl>=3.1.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
all = ["openbi[dev]"]
dev = ["pytest", "pytest-asyncio", "httpx"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "telegram_bot*"]
